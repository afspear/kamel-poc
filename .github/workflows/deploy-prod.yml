name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: true
        default: 'Manual production deployment'

env:
  ENVIRONMENT: production
  NAMESPACE: camel-k-prod
  CAMEL_K_VERSION: "2.8.0"

permissions:
  contents: write  # Needed for creating git tags

jobs:
  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prod.yourcompany.com
    permissions:
      contents: write  # Needed for creating git tags
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment info
        id: deploy-info
        run: |
          echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          echo "Configuring kubectl for production cluster..."
          mkdir -p $HOME/.kube
          echo "${{ secrets.PROD_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Backup current deployment
        id: backup
        run: |
          echo "Creating backup of current deployment..."
          BACKUP_DIR="backup-$(date +'%Y%m%d-%H%M%S')"
          mkdir -p $BACKUP_DIR
          
          # Backup existing integration if it exists
          if kubectl get integration consumer-prod -n ${{ env.NAMESPACE }} 2>/dev/null; then
            kubectl get integration consumer-prod -n ${{ env.NAMESPACE }} -o yaml > $BACKUP_DIR/integration.yaml
            echo "backup_created=true" >> $GITHUB_OUTPUT
            echo "backup_dir=$BACKUP_DIR" >> $GITHUB_OUTPUT
          else
            echo "No existing deployment to backup"
            echo "backup_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Install/Update Camel K Operator (if needed)
        run: |
          # Check if operator exists
          if ! kubectl get deployment camel-k-operator -n ${{ env.NAMESPACE }} 2>/dev/null; then
            echo "Installing Camel K Operator..."
            KAMEL_VERSION=${{ env.CAMEL_K_VERSION }}
            kubectl apply --server-side=true -k "github.com/apache/camel-k/install/overlays/kubernetes/descoped?ref=v${KAMEL_VERSION}" -n ${{ env.NAMESPACE }}
            kubectl wait --for=condition=available --timeout=180s deployment/camel-k-operator -n ${{ env.NAMESPACE }}
          else
            echo "Camel K Operator already exists"
          fi

      - name: Configure Integration Platform
        run: |
          # Apply integration platform configuration for production environment
          kubectl apply -f k8s/prod/integration-platform.yaml -n ${{ env.NAMESPACE }}
          sleep 5

      - name: Install Camel K CLI
        run: |
          KAMEL_VERSION=${{ env.CAMEL_K_VERSION }}
          curl -L https://github.com/apache/camel-k/releases/download/v${KAMEL_VERSION}/camel-k-client-${KAMEL_VERSION}-linux-amd64.tar.gz -o kamel.tar.gz
          tar -xzf kamel.tar.gz
          sudo mv kamel /usr/local/bin/
          chmod +x /usr/local/bin/kamel

      - name: Deploy Consumer Integration
        id: deploy
        run: |
          echo "Deploying consumer integration to production..."
          kubectl config set-context --current --namespace=${{ env.NAMESPACE }}
          
          # Deploy with production-specific traits and configurations
          kamel run consumer.java \
            --name consumer-prod \
            --namespace ${{ env.NAMESPACE }} \
            --property app.environment=production \
            --property app.version=${{ steps.deploy-info.outputs.version }} \
            -t container.image-pull-policy=Always \
            -t logging.level=INFO \
            -t prometheus.enabled=true \
            -t health.enabled=true \
            -t container.limit-cpu=500m \
            -t container.limit-memory=512Mi \
            -t container.request-cpu=200m \
            -t container.request-memory=256Mi \
            --wait

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."
          kubectl get integration consumer-prod -n ${{ env.NAMESPACE }}
          kubectl wait --for=condition=Ready --timeout=300s integration/consumer-prod -n ${{ env.NAMESPACE }}
          
          echo "Checking pods..."
          kubectl get pods -l camel.apache.org/integration=consumer-prod -n ${{ env.NAMESPACE }}

      - name: Run health checks
        run: |
          echo "Running health checks..."
          # Wait for at least one successful execution
          sleep 70
          
          # Check if pods completed successfully
          COMPLETED_PODS=$(kubectl get pods -l camel.apache.org/integration=consumer-prod -n ${{ env.NAMESPACE }} \
            --field-selector=status.phase=Succeeded --no-headers | wc -l)
          
          if [ "$COMPLETED_PODS" -ge 1 ]; then
            echo "✅ Health check passed - integration executed successfully"
          else
            echo "❌ Health check failed - no successful executions"
            kubectl get pods -l camel.apache.org/integration=consumer-prod -n ${{ env.NAMESPACE }}
            exit 1
          fi

      - name: Validate logs for errors
        run: |
          echo "Validating logs for errors..."
          LOGS=$(kubectl logs -l camel.apache.org/integration=consumer-prod -n ${{ env.NAMESPACE }} --tail=100 || true)
          
          if echo "$LOGS" | grep -i "error\|exception\|failed" | grep -v "ERROR_LEVEL"; then
            echo "⚠️  Warning: Errors found in logs"
            echo "$LOGS" | grep -i "error\|exception\|failed" | head -10
          else
            echo "✅ No errors found in logs"
          fi

      - name: Display Logs
        if: always()
        run: |
          echo "Fetching recent logs..."
          kubectl logs -l camel.apache.org/integration=consumer-prod -n ${{ env.NAMESPACE }} --tail=50 || true

      - name: Create deployment annotation
        run: |
          kubectl annotate integration consumer-prod -n ${{ env.NAMESPACE }} \
            deployment/timestamp="${{ steps.deploy-info.outputs.timestamp }}" \
            deployment/sha="${{ github.sha }}" \
            deployment/triggered-by="${{ github.actor }}" \
            deployment/reason="${{ github.event.inputs.reason || 'Push to main branch' }}" \
            deployment/previous-version="${{ steps.backup.outputs.backup_dir }}" \
            --overwrite

      - name: Create Git tag
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.deploy-info.outputs.version }}" -m "Production deployment ${{ steps.deploy-info.outputs.version }}"
          git push origin "${{ steps.deploy-info.outputs.version }}" || echo "Tag already exists"

      - name: Post deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to PRODUCTION successful!"
            echo "Version: ${{ steps.deploy-info.outputs.version }}"
            echo "Timestamp: ${{ steps.deploy-info.outputs.timestamp }}"
            echo "SHA: ${{ github.sha }}"
          else
            echo "❌ Deployment to PRODUCTION failed!"
            echo "Rollback may be required"
          fi

      - name: Store deployment artifact
        if: success()
        run: |
          mkdir -p deployment-info
          cat > deployment-info/prod-deployment.json << EOF
          {
            "environment": "production",
            "version": "${{ steps.deploy-info.outputs.version }}",
            "timestamp": "${{ steps.deploy-info.outputs.timestamp }}",
            "sha": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "status": "deployed"
          }
          EOF

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: prod-deployment-info
          path: deployment-info/
          retention-days: 365

      - name: Upload backup
        uses: actions/upload-artifact@v4
        if: steps.backup.outputs.backup_created == 'true'
        with:
          name: prod-backup-${{ steps.deploy-info.outputs.timestamp }}
          path: ${{ steps.backup.outputs.backup_dir }}/
          retention-days: 90

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Notification
        run: |
          echo "🚨 PRODUCTION DEPLOYMENT FAILED 🚨"
          echo "Manual intervention may be required"
          echo "Check the deployment logs and consider rolling back"
          echo ""
          echo "To rollback manually:"
          echo "1. Download the backup artifact from this workflow run"
          echo "2. Run: kubectl apply -f backup-*/integration.yaml -n ${{ env.NAMESPACE }}"
