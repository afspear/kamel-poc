name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
      - staging
  push:
    branches:
      - main
      - develop
      - staging

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Java syntax
        run: |
          echo "Validating Java files..."
          # Check for basic Java syntax errors
          for file in *.java; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              # Basic syntax check - look for class definition
              if ! grep -q "public class" "$file"; then
                echo "Warning: $file may not have proper class definition"
              fi
            fi
          done

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" *.yaml || true

      - name: Check shell scripts
        run: |
          echo "Checking shell scripts..."
          sudo apt-get install -y shellcheck
          shellcheck *.sh || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-test:
    name: Build Integration
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.30.0
          cluster_name: ci-cluster

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install Camel K
        run: |
          echo "Installing Camel K CLI..."
          KAMEL_VERSION=2.8.0
          curl -L https://github.com/apache/camel-k/releases/download/v${KAMEL_VERSION}/camel-k-client-${KAMEL_VERSION}-linux-amd64.tar.gz -o kamel.tar.gz
          tar -xzf kamel.tar.gz
          sudo mv kamel /usr/local/bin/
          chmod +x /usr/local/bin/kamel
          kamel version

          echo "Installing Camel K Operator..."
          kubectl create namespace camel-k
          kubectl apply --server-side=true -k "github.com/apache/camel-k/install/overlays/kubernetes/descoped?ref=v${KAMEL_VERSION}" -n camel-k
          
          echo "Waiting for operator to be ready..."
          kubectl wait --for=condition=available --timeout=180s deployment/camel-k-operator -n camel-k

      - name: Configure Integration Platform
        run: |
          kubectl apply -f itp.yaml -n camel-k
          sleep 5
          kubectl get integrationplatform -n camel-k

      - name: Validate Integration
        run: |
          echo "Validating consumer integration..."
          kamel run consumer.java --dev --logs=false &
          KAMEL_PID=$!
          
          sleep 30
          
          # Check if integration was created
          kubectl get integration consumer || echo "Integration not found"
          
          # Kill the kamel process
          kill $KAMEL_PID || true
          
          echo "Integration validation complete"

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan, build-and-test]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.lint-and-validate.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
